[mod-name]
se-smart-delivery-cannon= cañón de entrega inteligente SE

[mod-description]
se-smart-delivery-cannon=Parada automática de los cañones de entrega de Space Exploration: el objetivo se obtiene del cañón y este se detiene cuando el cofre objetivo está lleno.

[se-smart-cannon]
title=Cañón de entrega inteligente
mode-title=Modo de funcionamiento
mode-manual=Manual
mode-auto=Automático
mode-multi=Multi-Automático (próximamente)
mode-multi-tooltip=Próximamente: un solo cañón alternando entre varios cofres objetivo.
target-title=Objetivo (obtenido del cañón)
target-none=Sin objetivo (apunta el cañón una vez)
target-format=__1__ (__2__, __3__)
link-chest=Vincular cofre
limit-title=Detener cuando el cofre ocupe (ranuras)
limit-tooltip=En modo automático, el cañón se detiene cuando el cofre objetivo alcanza esta cantidad de ranuras ocupadas. Deja un pequeño margen para las cápsulas que aún están en vuelo.
capacity-title=Capacidad del cofre
slots=__1__ / __2__ ranuras
status-manual=Control manual
status-no-target=Detenido (apunta el cañón una vez)
status-no-chest=Detenido (no hay ningún cofre en el objetivo)
status-no-chest-firing=Disparando (no hay ningún cofre en el objetivo)
status-full=Detenido (el cofre está LLENO)
status-ready=Listo para disparar
msg-target-set=Cañón inteligente: objetivo capturado: __1__
msg-link-prompt=Cañón inteligente: coloca el cursor sobre el cofre objetivo (__1__).
msg-linked=Cañón inteligente: objetivo establecido desde el cofre.
msg-settings-pasted=Cañón inteligente: configuración pegada. Objetivo: __1__

[mod-setting-name]
se-sc-check-interval=Intervalo de comprobación (ticks)
se-sc-default-limit=Límite de parada predeterminado (ranuras)
se-sc-default-mode=Modo predeterminado para nuevos cañones
se-sc-stop-without-chest=Detener cañones sin cofre en el objetivo
se-sc-show-messages=Mostrar mensajes del cañón inteligente

[mod-setting-description]
se-sc-check-interval=Frecuencia con la que se comprueban los cañones. Un valor menor ofrece mayor precisión, mientras que uno mayor reduce la carga sobre los UPS. Requiere reiniciar el juego.
se-sc-default-limit=Límite de parada asignado a los cañones recién construidos. Los cañones existentes conservan su propio valor.
se-sc-default-mode=Modo asignado a los cañones recién construidos.
se-sc-stop-without-chest=En modo automático, detiene un cañón si no hay ningún cofre en su objetivo, evitando que las cápsulas exploten en el suelo.
se-sc-show-messages=Muestra un mensaje en el chat cuando se captura un objetivo.

[string-mod-setting]
se-sc-default-mode-manual=Manual
se-sc-default-mode-auto=Automático