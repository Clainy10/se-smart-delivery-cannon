[mod-name]
se-smart-delivery-cannon=Inteligentna armata dostawcza SE

[mod-description]
se-smart-delivery-cannon=Automatyczne zatrzymywanie armat dostawczych Space Exploration: cel jest pobierany z armaty, a armata zatrzymuje się, gdy docelowa skrzynia jest pełna.

[se-smart-cannon]
title=Inteligentna armata dostawcza
mode-title=Tryb działania
mode-manual=Ręczny
mode-auto=Automatyczny
mode-multi=Wieloautomatyczny (wkrótce)
mode-multi-tooltip=Wkrótce: jedna armata przełączająca się między wieloma skrzyniami docelowymi.
target-title=Cel (pobrany z armaty)
target-none=Brak celu (wyceluj armatę jeden raz)
target-format=__1__ (__2__, __3__)
link-chest=Połącz skrzynię
limit-title=Zatrzymaj, gdy skrzynia zajmie (sloty)
limit-tooltip=W trybie automatycznym armata zatrzymuje się, gdy docelowa skrzynia osiągnie określoną liczbę zajętych slotów. Zostaw niewielki zapas na kapsuły będące jeszcze w locie.
capacity-title=Pojemność skrzyni
slots=__1__ / __2__ slotów
status-manual=Sterowanie ręczne
status-no-target=Zatrzymana (wyceluj armatę jeden raz)
status-no-chest=Zatrzymana (brak skrzyni w miejscu celu)
status-no-chest-firing=Strzela (brak skrzyni w miejscu celu)
status-full=Zatrzymana (skrzynia jest PEŁNA)
status-ready=Gotowa do strzału
msg-target-set=Inteligentna armata: ustawiono cel: __1__
msg-link-prompt=Inteligentna armata: najedź kursorem na skrzynię docelową (__1__).
msg-linked=Inteligentna armata: cel ustawiony na podstawie skrzyni.
msg-settings-pasted=Inteligentna armata: wklejono ustawienia. Cel: __1__

[mod-setting-name]
se-sc-check-interval=Interwał sprawdzania (tiki)
se-sc-default-limit=Domyślny limit zatrzymania (sloty)
se-sc-default-mode=Domyślny tryb dla nowych armat
se-sc-stop-without-chest=Zatrzymuj armaty bez skrzyni w miejscu celu
se-sc-show-messages=Pokazuj komunikaty inteligentnej armaty

[mod-setting-description]
se-sc-check-interval=Jak często sprawdzane są armaty. Niższa wartość zwiększa dokładność, wyższa zmniejsza obciążenie UPS. Wymaga ponownego uruchomienia gry.
se-sc-default-limit=Limit zatrzymania przypisywany nowo zbudowanym armatom. Istniejące armaty zachowują własną wartość.
se-sc-default-mode=Tryb przypisywany nowo zbudowanym armatom.
se-sc-stop-without-chest=W trybie automatycznym zatrzymuje armatę, gdy w miejscu celu nie ma skrzyni, aby kapsuły nie eksplodowały na ziemi.
se-sc-show-messages=Wyświetla wiadomość na czacie po przechwyceniu celu.

[string-mod-setting]
se-sc-default-mode-manual=Ręczny
se-sc-default-mode-auto=Automatyczny