[mod-name]
se-smart-delivery-cannon=SE 智能交付炮

[mod-description]
se-smart-delivery-cannon=为太空探索（Space Exploration）交付炮提供自动停止功能：目标从炮台获取，当目标箱子装满时，炮台自动停止。

[se-smart-cannon]
title=智能交付炮
mode-title=运行模式
mode-manual=手动
mode-auto=自动
mode-multi=多重自动（即将推出）
mode-multi-tooltip=即将推出：一门炮可以在多个目标箱子之间循环切换。
target-title=目标（从炮台获取）
target-none=没有目标（请先瞄准一次）
target-format=__1__ (__2__, __3__)
link-chest=关联箱子
limit-title=箱子占用达到（格）时停止
limit-tooltip=在自动模式下，当目标箱子的已占用格数达到此数值时，炮台将停止。请预留少量空间，以容纳仍在飞行中的胶囊。
capacity-title=箱子容量
slots=__1__ / __2__ 格
status-manual=手动控制
status-no-target=已停止（请先瞄准一次）
status-no-chest=已停止（目标位置没有箱子）
status-no-chest-firing=正在发射（目标位置没有箱子）
status-full=已停止（箱子已满）
status-ready=准备发射
msg-target-set=智能炮：已获取目标：__1__
msg-link-prompt=智能炮：将鼠标悬停在目标箱子上（__1__）。
msg-linked=智能炮：已根据箱子设置目标。
msg-settings-pasted=智能炮：设置已粘贴。目标：__1__

[mod-setting-name]
se-sc-check-interval=检查间隔（游戏刻）
se-sc-default-limit=默认停止限制（格）
se-sc-default-mode=新建炮台的默认模式
se-sc-stop-without-chest=目标位置没有箱子时停止炮台
se-sc-show-messages=显示智能炮消息

[mod-setting-description]
se-sc-check-interval=检查炮台的频率。数值越低，检测越精确；数值越高，对 UPS 的负担越小。需要重启游戏。
se-sc-default-limit=新建炮台使用的默认停止限制。现有炮台保留各自的数值。
se-sc-default-mode=新建炮台使用的默认模式。
se-sc-stop-without-chest=在自动模式下，如果目标位置没有箱子，则停止炮台，防止胶囊在地面爆炸。
se-sc-show-messages=获取目标时在聊天栏中显示消息。

[string-mod-setting]
se-sc-default-mode-manual=手动
se-sc-default-mode-auto=自动