[mod-name]
se-smart-delivery-cannon=SE Smart Delivery Cannon

[mod-description]
se-smart-delivery-cannon=Автоостановка доставочных пушек Space Exploration: цель берётся из пушки, а пушка останавливается, когда целевой сундук полон.

[se-smart-cannon]
title=Умная доставочная пушка
mode-title=Режим работы
mode-manual=Ручной
mode-auto=Авто
mode-multi=Мульти-авто (скоро)
mode-multi-tooltip=Скоро: одна пушка будет по очереди стрелять в несколько сундуков.
target-title=Цель (берётся из пушки)
target-none=Цели нет (наведите пушку один раз)
target-format=__1__ (__2__, __3__)
link-chest=Привязать сундук
limit-title=Остановка при заполнении (слотов)
limit-tooltip=В режиме «Авто» пушка останавливается, когда в целевом сундуке занято столько слотов. Оставьте небольшой запас для капсул, которые ещё в полёте.
capacity-title=Заполнение сундука
slots=__1__ / __2__ слотов
status-manual=Ручное управление
status-no-target=Остановлена (наведите пушку один раз)
status-no-chest=Остановлена (в цели нет сундука)
status-no-chest-firing=Стреляет (в цели нет сундука)
status-full=Остановлена (сундук ПОЛОН)
status-ready=Готова к выстрелу
msg-target-set=Умная пушка: цель получена: __1__
msg-link-prompt=Умная пушка: наведите курсор на целевой сундук (__1__).
msg-linked=Умная пушка: цель задана по сундуку.
msg-settings-pasted=Умная пушка: настройки вставлены. Цель: __1__

[mod-setting-name]
se-sc-check-interval=Интервал проверки (тики)
se-sc-default-limit=Лимит остановки по умолчанию (слотов)
se-sc-default-mode=Режим новых пушек по умолчанию
se-sc-stop-without-chest=Останавливать пушки, если в цели нет сундука
se-sc-show-messages=Показывать сообщения Smart Cannon

[mod-setting-description]
se-sc-check-interval=Как часто проверяются пушки. Меньше — точнее, больше — легче для UPS. Требуется перезапуск.
se-sc-default-limit=Лимит остановки для новых пушек. У уже построенных остаётся своё значение.
se-sc-default-mode=Режим, который получают новые пушки.
se-sc-stop-without-chest=В режиме «Авто» останавливать пушку, если в цели нет сундука, чтобы капсулы не взрывались на земле.
se-sc-show-messages=Выводить сообщение в чат, когда цель получена.

[string-mod-setting]
se-sc-default-mode-manual=Ручной
se-sc-default-mode-auto=Авто