[mod-name]
se-smart-delivery-cannon=Intelligente SE-Lieferkanone

[mod-description]
se-smart-delivery-cannon=Automatisches Anhalten von Space-Exploration-Lieferkanonen: Das Ziel wird aus der Kanone übernommen und die Kanone stoppt, sobald die Zielkiste voll ist.

[se-smart-cannon]
title=Intelligente Lieferkanone
mode-title=Betriebsmodus
mode-manual=Manuell
mode-auto=Automatisch
mode-multi=Multi-Automatisch (demnächst)
mode-multi-tooltip=Demnächst: Eine Kanone wechselt zwischen mehreren Zielkisten.
target-title=Ziel (aus der Kanone übernommen)
target-none=Kein Ziel (Kanone einmal ausrichten)
target-format=__1__ (__2__, __3__)
link-chest=Kiste verknüpfen
limit-title=Stoppen, wenn die Kiste (Slots) belegt
limit-tooltip=Im Automatikmodus stoppt die Kanone, sobald die Zielkiste diese Anzahl belegter Slots erreicht. Lass etwas Platz für noch fliegende Kapseln.
capacity-title=Kistenkapazität
slots=__1__ / __2__ Slots
status-manual=Manuelle Steuerung
status-no-target=Gestoppt (Kanone einmal ausrichten)
status-no-chest=Gestoppt (keine Kiste am Ziel)
status-no-chest-firing=Feuert (keine Kiste am Ziel)
status-full=Gestoppt (Kiste ist VOLL)
status-ready=Schussbereit
msg-target-set=Intelligente Kanone: Ziel übernommen: __1__
msg-link-prompt=Intelligente Kanone: Bewege den Mauszeiger über die Zielkiste (__1__).
msg-linked=Intelligente Kanone: Ziel anhand der Kiste festgelegt.
msg-settings-pasted=Intelligente Kanone: Einstellungen eingefügt. Ziel: __1__

[mod-setting-name]
se-sc-check-interval=Prüfintervall (Ticks)
se-sc-default-limit=Standard-Stoppgrenze (Slots)
se-sc-default-mode=Standardmodus für neue Kanonen
se-sc-stop-without-chest=Kanonen ohne Kiste am Ziel stoppen
se-sc-show-messages=Nachrichten der intelligenten Kanone anzeigen

[mod-setting-description]
se-sc-check-interval=Wie oft Kanonen überprüft werden. Ein niedrigerer Wert ist genauer, ein höherer Wert reduziert die UPS-Belastung. Neustart erforderlich.
se-sc-default-limit=Stoppgrenze für neu gebaute Kanonen. Bestehende Kanonen behalten ihren eigenen Wert.
se-sc-default-mode=Modus für neu gebaute Kanonen.
se-sc-stop-without-chest=Stoppt im Automatikmodus eine Kanone, wenn sich am Ziel keine Kiste befindet, damit Kapseln nicht auf dem Boden explodieren.
se-sc-show-messages=Zeigt eine Chatnachricht an, wenn ein Ziel übernommen wird.

[string-mod-setting]
se-sc-default-mode-manual=Manuell
se-sc-default-mode-auto=Automatisch