[mod-name]
se-smart-delivery-cannon=SE Smart Delivery Cannon

[mod-description]
se-smart-delivery-cannon=Auto-stop for Space Exploration delivery cannons: the target is taken from the cannon and the cannon stops when the target chest is full.

[se-smart-cannon]
title=Smart Delivery Cannon
mode-title=Operation mode
mode-manual=Manual
mode-auto=Auto
mode-multi=Multi-Auto (soon)
mode-multi-tooltip=Coming soon: one cannon cycling between several target chests.
target-title=Target (taken from the cannon)
target-none=No target (aim the cannon once)
target-format=__1__ (__2__, __3__)
link-chest=Link chest
limit-title=Stop when the chest uses (slots)
limit-tooltip=In Auto mode the cannon stops once the target chest has this many occupied slots. Leave a small margin for capsules still in flight.
capacity-title=Chest capacity
slots=__1__ / __2__ slots
status-manual=Manual control
status-no-target=Stopped (aim the cannon once)
status-no-chest=Stopped (no chest at the target)
status-no-chest-firing=Firing (no chest at the target)
status-full=Stopped (chest is FULL)
status-ready=Ready to fire
msg-target-set=Smart Cannon: target captured: __1__
msg-link-prompt=Smart Cannon: hover the target chest (__1__).
msg-linked=Smart Cannon: target set from the chest.
msg-settings-pasted=Smart Cannon: settings pasted. Target: __1__

[mod-setting-name]
se-sc-check-interval=Check interval (ticks)
se-sc-default-limit=Default stop limit (slots)
se-sc-default-mode=Default mode for new cannons
se-sc-stop-without-chest=Stop cannons with no chest at the target
se-sc-show-messages=Show Smart Cannon messages

[mod-setting-description]
se-sc-check-interval=How often cannons are checked. Lower is more precise, higher is lighter on UPS. Requires a restart.
se-sc-default-limit=Stop limit given to newly built cannons. Existing cannons keep their own value.
se-sc-default-mode=Mode given to newly built cannons.
se-sc-stop-without-chest=In Auto mode, stop a cannon when there is no chest at its target, so capsules do not explode on the ground.
se-sc-show-messages=Print a chat message when a target is captured.

[string-mod-setting]
se-sc-default-mode-manual=Manual
se-sc-default-mode-auto=Auto