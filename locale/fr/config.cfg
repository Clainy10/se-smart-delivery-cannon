[mod-name]
se-smart-delivery-cannon=Canon de livraison intelligent SE

[mod-description]
se-smart-delivery-cannon=Arrêt automatique des canons de livraison de Space Exploration : la cible est récupérée depuis le canon et celui-ci s'arrête lorsque le coffre cible est plein.

[se-smart-cannon]
title=Canon de livraison intelligent
mode-title=Mode de fonctionnement
mode-manual=Manuel
mode-auto=Automatique
mode-multi=Multi-Automatique (bientôt)
mode-multi-tooltip=Bientôt : un seul canon alternant entre plusieurs coffres cibles.
target-title=Cible (récupérée depuis le canon)
target-none=Aucune cible (visez une fois avec le canon)
target-format=__1__ (__2__, __3__)
link-chest=Lier un coffre
limit-title=Arrêter lorsque le coffre utilise (emplacements)
limit-tooltip=En mode automatique, le canon s'arrête lorsque le coffre cible atteint ce nombre d'emplacements occupés. Laissez une petite marge pour les capsules encore en vol.
capacity-title=Capacité du coffre
slots=__1__ / __2__ emplacements
status-manual=Contrôle manuel
status-no-target=Arrêté (visez une fois avec le canon)
status-no-chest=Arrêté (aucun coffre à la cible)
status-no-chest-firing=Tir en cours (aucun coffre à la cible)
status-full=Arrêté (le coffre est PLEIN)
status-ready=Prêt à tirer
msg-target-set=Canon intelligent : cible enregistrée : __1__
msg-link-prompt=Canon intelligent : survolez le coffre cible (__1__).
msg-linked=Canon intelligent : cible définie depuis le coffre.
msg-settings-pasted=Canon intelligent : paramètres collés. Cible : __1__

[mod-setting-name]
se-sc-check-interval=Intervalle de vérification (ticks)
se-sc-default-limit=Limite d'arrêt par défaut (emplacements)
se-sc-default-mode=Mode par défaut des nouveaux canons
se-sc-stop-without-chest=Arrêter les canons sans coffre à la cible
se-sc-show-messages=Afficher les messages du canon intelligent

[mod-setting-description]
se-sc-check-interval=Fréquence de vérification des canons. Une valeur plus faible améliore la précision, une valeur plus élevée réduit la charge sur les UPS. Redémarrage requis.
se-sc-default-limit=Limite d'arrêt attribuée aux nouveaux canons. Les canons existants conservent leur propre valeur.
se-sc-default-mode=Mode attribué aux nouveaux canons.
se-sc-stop-without-chest=En mode automatique, arrête le canon lorsqu'aucun coffre n'est présent à sa cible, afin d'éviter que les capsules n'explosent au sol.
se-sc-show-messages=Affiche un message dans le chat lorsqu'une cible est enregistrée.

[string-mod-setting]
se-sc-default-mode-manual=Manuel
se-sc-default-mode-auto=Automatique