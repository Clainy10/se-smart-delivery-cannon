[mod-setting-description]
se-sc-check-interval=Cât de des sunt verificate tunurile. O valoare mai mică oferă precizie mai mare, iar una mai mare reduce încărcarea asupra UPS. Necesită repornirea jocului.
se-sc-default-limit=Limita de oprire atribuită tunurilor nou construite. Tunurile existente își păstrează propria valoare.
se-sc-default-mode=Modul atribuit tunurilor nou construite.
se-sc-stop-without-chest=În modul Automat, oprește tunul dacă nu există niciun cufăr la țintă, pentru a preveni explodarea capsulelor pe sol.
se-sc-show-messages=Afișează un mesaj în chat atunci când o țintă este preluată.

