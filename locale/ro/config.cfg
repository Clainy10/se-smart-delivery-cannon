[mod-name]
se-smart-delivery-cannon=Cannon inteligent de livrare SE

[mod-description]
se-smart-delivery-cannon=Oprire automată pentru tunurile de livrare din Space Exploration: ținta este preluată din tun, iar acesta se oprește când cufărul țintă este plin.

